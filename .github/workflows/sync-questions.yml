name: Sync community questions

on:
  discussion:
    types: [created, edited, deleted, transferred, category_changed, answered, unanswered]
  discussion_comment:
    types: [created, edited, deleted]
  public:
  workflow_dispatch:

permissions:
  contents: write
  discussions: read

concurrency:
  group: community-question-snapshot
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Check the exporter
        run: python3 -m unittest discover -s tests -p 'test_sync_questions.py'
      - name: Export current questions
        run: python3 scripts/sync_questions.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save updated snapshot
        env:
          SYNC_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- chi2027/data/questions.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chi2027/data/questions.json
          git commit -m 'Update community question snapshot'
          git pull --rebase origin "$SYNC_BRANCH"
          git push origin "HEAD:$SYNC_BRANCH"
