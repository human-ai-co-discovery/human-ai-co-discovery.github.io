<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Hero Banner (archived)</title>
  <!--
    Archived hero banner from the CHI 2027 page (chi2027/index.html), removed on 2026-09-26.
    Open this file through a local server to preview it; it reads the color tokens from
    chi2027/assets/css/workshop.css, so it follows light and dark mode like the live page.

    To restore it on the page:
      1. Paste the <div class="hero-art"> block at the top of <header> in chi2027/index.html,
         with the Tailwind classes it had there:
         class="hero-art w-full h-56 sm:h-64 md:h-80 mb-10 bg-tide-50/60 rounded-2xl border border-tide-100 overflow-hidden"
      2. Move the rules between "BEGIN hero" and "END hero" below into chi2027/assets/css/workshop.css,
         including the --dot tokens and the reduced-motion and print rules.
  -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@600;700&display=swap">
  <link rel="stylesheet" href="../assets/css/workshop.css">
  <style>
    /* Preview-only frame, standing in for the Tailwind classes listed above. */
    body { margin: 0; padding: 2rem 1.5rem; font-family: Urbanist, sans-serif; }
    .hero-art {
      max-width: 56rem; height: 20rem; margin: 0 auto;
      background: rgb(var(--tide-50) / 0.6); border: 1px solid rgb(var(--tide-100));
      border-radius: 1rem; overflow: hidden;
    }

    /* ---------- BEGIN hero ---------- */
    :root { --dot: 138 150 163; }
    @media (prefers-color-scheme: dark) { :root { --dot: 125 141 152; } }

/* ---------- Hero illustration: a traced path toward a eureka ---------- */
.hero-art svg { display: block; width: 100%; height: 100%; }
.fig-glow { fill: rgb(var(--ember-50)); }
.fig-dot { fill: rgb(var(--dot)); opacity: 0.8; }
.fig-link { fill: none; stroke: rgb(var(--tide-300)); stroke-width: 1; stroke-dasharray: 3 5; opacity: 0.7; }
.fig-path {
  fill: none; stroke: rgb(var(--ember-400)); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 1; stroke-dashoffset: 1;
  animation: trace 2.6s cubic-bezier(.6,.05,.3,1) 0.4s forwards;
}
.fig-node { fill: rgb(var(--surface)); stroke: rgb(var(--tide-900)); stroke-width: 2.5; opacity: 0; animation: appear 0.4s ease forwards; }
.fig-node.n1 { animation-delay: 0.5s; } .fig-node.n2 { animation-delay: 1.1s; } .fig-node.n3 { animation-delay: 1.8s; }
.fig-eureka { fill: rgb(var(--ember-400)); opacity: 0; animation: appear 0.5s ease 2.9s forwards; }
.fig-halo {
  fill: none; stroke: rgb(var(--ember-400)); stroke-width: 1.5; opacity: 0;
  transform-box: fill-box; transform-origin: center;
  animation: halo 2.8s ease-out 3.1s infinite;
}
.fig-label {
  font-family: Urbanist, sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.04em;
  fill: rgb(var(--ink-soft)); opacity: 0; animation: appear 0.6s ease forwards;
}
.fig-label.l1 { animation-delay: 0.7s; } .fig-label.l2 { animation-delay: 1.3s; }
.fig-label.l3 { animation-delay: 2s; }
.fig-label.l4 { animation-delay: 3s; fill: rgb(var(--ember-700)); font-weight: 700; }

@keyframes trace { to { stroke-dashoffset: 0; } }
@keyframes appear { to { opacity: 1; } }
@keyframes halo { 0% { opacity: 0.7; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }

    @media (prefers-reduced-motion: reduce) {
      .fig-path { stroke-dashoffset: 0; }
      .fig-node, .fig-eureka, .fig-label { opacity: 1; }
      .fig-halo { display: none; }
    }
    @media print { .hero-art { display: none !important; } }
    /* ---------- END hero ---------- */
  </style>
</head>
<body>
      <!-- Hero illustration -->
      <div class="hero-art" aria-hidden="true">
        <svg viewBox="0 0 880 320" preserveAspectRatio="xMidYMid slice" role="presentation">
          <circle class="fig-glow" cx="640" cy="80" r="150" opacity="0.7"/>
          <g>
            <circle class="fig-dot" cx="36" cy="44" r="3"/><circle class="fig-dot" cx="92" cy="128" r="2.5"/>
            <circle class="fig-dot" cx="60" cy="236" r="3"/><circle class="fig-dot" cx="128" cy="286" r="2.5"/>
            <circle class="fig-dot" cx="150" cy="60" r="2.5"/><circle class="fig-dot" cx="176" cy="178" r="3"/>
            <circle class="fig-dot" cx="214" cy="26" r="2.5"/><circle class="fig-dot" cx="232" cy="118" r="3"/>
            <circle class="fig-dot" cx="286" cy="62" r="2.5"/><circle class="fig-dot" cx="300" cy="292" r="3"/>
            <circle class="fig-dot" cx="330" cy="118" r="2.5"/><circle class="fig-dot" cx="394" cy="44" r="3"/>
            <circle class="fig-dot" cx="420" cy="272" r="2.5"/><circle class="fig-dot" cx="438" cy="128" r="3"/>
            <circle class="fig-dot" cx="478" cy="58" r="2.5"/><circle class="fig-dot" cx="540" cy="282" r="3"/>
            <circle class="fig-dot" cx="560" cy="170" r="2.5"/><circle class="fig-dot" cx="546" cy="24" r="2.5"/>
            <circle class="fig-dot" cx="608" cy="232" r="3"/><circle class="fig-dot" cx="700" cy="160" r="2.5"/>
            <circle class="fig-dot" cx="716" cy="28" r="3"/><circle class="fig-dot" cx="744" cy="252" r="2.5"/>
            <circle class="fig-dot" cx="782" cy="96" r="3"/><circle class="fig-dot" cx="820" cy="196" r="2.5"/>
            <circle class="fig-dot" cx="846" cy="40" r="2.5"/><circle class="fig-dot" cx="850" cy="290" r="3"/>
            <circle class="fig-dot" cx="664" cy="296" r="2.5"/><circle class="fig-dot" cx="196" cy="236" r="2.5"/>
          </g>
          <!-- Paths not taken -->
          <path class="fig-link" d="M360 180 L 438 128 L 478 58"/>
          <path class="fig-link" d="M500 215 L 560 170 L 608 232"/>
          <path class="fig-link" d="M240 250 L 176 178 L 232 118"/>
          <!-- The discovery -->
          <path class="fig-path" pathLength="1" d="M240 250 C 280 228, 320 196, 360 180 S 460 215, 500 215 S 590 140, 640 80"/>
          <circle class="fig-node n1" cx="240" cy="250" r="7"/>
          <circle class="fig-node n2" cx="360" cy="180" r="7"/>
          <circle class="fig-node n3" cx="500" cy="215" r="7"/>
          <circle class="fig-halo" cx="640" cy="80" r="12"/>
          <circle class="fig-eureka" cx="640" cy="80" r="10"/>
          <text class="fig-label l1" x="254" y="278">a question</text>
          <text class="fig-label l2" x="306" y="160">a connection</text>
          <text class="fig-label l3" x="448" y="250">an explanation</text>
          <text class="fig-label l4" x="620" y="50" text-anchor="end">whose eureka?</text>
        </svg>
      </div>
</body>
</html>
